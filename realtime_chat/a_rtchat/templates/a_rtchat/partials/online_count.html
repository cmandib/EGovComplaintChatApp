<span id="online-count" hx-swap-oob="outerHTML" class="pr-1">
    {%if chatroom.is_private == True%}
    {%if online_count == 1%}
    <p class="w-2 h-2 rounded-full bg-green-500"></p>
    {%else%}
    <p class="w-2 h-2 rounded-full bg-gray-400"></p>
    {%endif%}
    {%else%}
    {{online_count}}
    {%endif%}
</span>
