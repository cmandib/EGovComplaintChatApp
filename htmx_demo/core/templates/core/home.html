{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Live Users</title>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
</head>
<body>
    <h1>Hello, {{ request.user.first_name }}</h1>

    <form 
    hx-post="{% url 'update_name' %}" 
    hx-swap="none" 
    method="POST">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Change your name">
        <button type="submit">Update</button>
    </form>


    <h2>All Users:</h2>
    <div 
        id="users-list"
        hx-get="{% url 'users_list' %}"
        hx-trigger="every 2s"
        hx-swap="innerHTML">
        {% include 'core/partials/users_list.html' %}
    </div>
</body>
</html>
